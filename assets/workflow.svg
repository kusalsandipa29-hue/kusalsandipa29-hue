<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">My project management workflow</title>
  <desc id="d">A continuous loop: 1 Discovery, 2 Requirements, 3 Planning, 4 Execution, 5 QA, 6 Delivery, 7 Continuous Improvement, then back to Discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021626"/><stop offset="1" stop-color="#023047"/>
    </linearGradient>
    <linearGradient id="track" x1="0" x2="1">
      <stop offset="0" stop-color="#219EBC"/><stop offset="1" stop-color="#5EE1F2"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .lbl{font-size:21px;font-weight:600;fill:#EAF6FB;text-anchor:middle}
    .num{font-size:15px;font-weight:700;fill:#021626;text-anchor:middle}
    .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}.mover{display:none}}
  </style>

  <rect width="960" height="420" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="959" height="419" rx="22" fill="none" stroke="#8ECAE6" stroke-opacity=".14"/>

  <!-- loop track -->
  <path id="loop" d="M200 120 H760 A100 100 0 0 1 760 320 H200 A100 100 0 0 1 200 120 Z" fill="none" stroke="#8ECAE6" stroke-opacity=".16" stroke-width="10"/>
  <path d="M200 120 H760 A100 100 0 0 1 760 320 H200 A100 100 0 0 1 200 120 Z" fill="none" stroke="url(#track)" stroke-width="2.5" class="flow"/>

  <!-- traveller -->
  <g class="mover">
    <circle r="9" fill="#22D3EE" opacity=".55" filter="url(#soft)">
      <animateMotion dur="12s" repeatCount="indefinite"><mpath href="#loop" xlink:href="#loop"/></animateMotion>
    </circle>
    <circle r="4.5" fill="#E0FBFF">
      <animateMotion dur="12s" repeatCount="indefinite"><mpath href="#loop" xlink:href="#loop"/></animateMotion>
    </circle>
  </g>

  <!-- centre caption -->
  <g class="mono" text-anchor="middle">
    <text x="480" y="212" font-size="13" letter-spacing="4" fill="#8ECAE6" opacity=".85">DELIVERY LOOP</text>
    <text x="480" y="238" font-size="13" letter-spacing="1" fill="#8ECAE6" opacity=".6">plan · coordinate · track · improve</text>
  </g>

  <!-- nodes: top row L→R -->
  <g class="sans">
    <g transform="translate(200 120)"><circle r="20" fill="#5EE1F2"/><text y="5" class="num">1</text><text y="-36" class="lbl">Discovery</text></g>
    <g transform="translate(387 120)"><circle r="20" fill="#5EE1F2"/><text y="5" class="num">2</text><text y="-36" class="lbl">Requirements</text></g>
    <g transform="translate(573 120)"><circle r="20" fill="#5EE1F2"/><text y="5" class="num">3</text><text y="-36" class="lbl">Planning</text></g>
    <g transform="translate(760 120)"><circle r="20" fill="#5EE1F2"/><text y="5" class="num">4</text><text y="-36" class="lbl">Execution</text></g>
    <!-- bottom row R→L -->
    <g transform="translate(760 320)"><circle r="20" fill="#219EBC"/><text y="5" class="num">5</text><text y="52" class="lbl">QA</text></g>
    <g transform="translate(480 320)"><circle r="20" fill="#219EBC"/><text y="5" class="num">6</text><text y="52" class="lbl">Delivery</text></g>
    <g transform="translate(200 320)"><circle r="20" fill="#219EBC"/><text y="5" class="num">7</text><text y="52" class="lbl">Continuous Improvement</text></g>
  </g>

  <!-- direction chevrons -->
  <g fill="none" stroke="#5EE1F2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M290 113 l7 7 -7 7"/><path d="M477 113 l7 7 -7 7"/><path d="M663 113 l7 7 -7 7"/>
    <path d="M627 313 l-7 7 7 7"/><path d="M347 313 l-7 7 7 7"/>
  </g>
</svg>
