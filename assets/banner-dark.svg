<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Kusal Sandipa — Software Project Management | Project Management Intern</title>
  <desc id="d">Bridging business requirements, technology and project delivery. Project Management Intern at Sri Lanka Telecom. Decorative delivery timeline and a delivery pipeline from discovery to improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021626"/><stop offset=".55" stop-color="#023047"/><stop offset="1" stop-color="#03405F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".84" cy=".08" r=".6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".20"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#219EBC"/><stop offset="1" stop-color="#5EE1F2"/></linearGradient>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#5EE1F2" stop-opacity="0"/><stop offset=".8" stop-color="#5EE1F2" stop-opacity=".9"/><stop offset="1" stop-color="#E0FBFF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8ECAE6" opacity=".09"/></pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="trackclip"><rect x="96" y="349" width="1008" height="6"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .rise{opacity:0;animation:rise .9s ease-out forwards}.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}
    .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    .b2{animation-delay:.25s}.b3{animation-delay:.5s}.b4{animation-delay:.75s}.b5{animation-delay:1s}
    .draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.2s .5s ease-out forwards}
    .today{animation:sweep 10s ease-in-out 1.5s infinite alternate}
    .live{animation:blink 2.4s ease-in-out infinite}
    .travel{animation:travel 7.7s linear infinite}
    .stage{transform-box:fill-box;transform-origin:center;animation:stage 7.7s ease-in-out infinite}
    .s0{animation-delay:0.0s}.s1{animation-delay:1.1s}.s2{animation-delay:2.2s}.s3{animation-delay:3.3s}.s4{animation-delay:4.4s}.s5{animation-delay:5.5s}.s6{animation-delay:6.6s}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(150px)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes travel{from{transform:translateX(-160px)}to{transform:translateX(1028px)}}
    @keyframes stage{0%,100%{opacity:.55}6%{opacity:1}16%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){
      .rise{opacity:1;animation:none}.grow{transform:none;animation:none}.draw{stroke-dashoffset:0;animation:none}
      .today,.live,.stage{animation:none}.stage{opacity:1}.travel{display:none}
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#8ECAE6" stroke-opacity=".16"/>

  <!-- identity -->
  <g class="sans">
    <text x="70" y="118" font-size="68" font-weight="700" fill="#F4F9FC" letter-spacing="-1" class="rise">Kusal Sandipa</text>
    <path d="M72 140 H312" stroke="url(#bar)" stroke-width="4" stroke-linecap="round" class="draw"/>
    <text x="72" y="186" font-size="31" font-weight="600" fill="#5EE1F2" class="rise r2">Software Project Management</text>
    <text x="72" y="222" font-size="21" font-weight="500" fill="#BFE3F2" class="rise r3">Project Management Intern · Sri Lanka Telecom</text>
    <text x="72" y="270" font-size="18.5" fill="#8ECAE6" class="rise r4">Bridging business requirements, technology &amp; project delivery.</text>
  </g>

  <!-- planning timeline -->
  <g transform="translate(768 46)"><g class="rise r3">
    <rect width="364" height="232" rx="16" fill="#021A2B" fill-opacity=".72" stroke="#8ECAE6" stroke-opacity=".16"/>
    <text x="20" y="30" class="mono" font-size="11" letter-spacing="2" fill="#8ECAE6">DELIVERY TIMELINE</text>
    <circle cx="282" cy="26" r="4" fill="#5EE1F2" class="live"/>
    <text x="344" y="30" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#8ECAE6">ONGOING</text>
    <line x1="16" y1="46" x2="348" y2="46" stroke="#8ECAE6" stroke-opacity=".12"/>
    <g class="mono" font-size="10.5" fill="#8ECAE6" letter-spacing="1">
      <text x="20" y="79">REQUIREMENTS</text><text x="20" y="111">PLANNING</text>
      <text x="20" y="143">EXECUTION</text><text x="20" y="175">QA</text><text x="20" y="207">DELIVERY</text>
    </g>
    <g stroke="#8ECAE6" stroke-opacity=".08">
      <line x1="130" y1="58" x2="130" y2="218"/><line x1="184" y1="58" x2="184" y2="218"/>
      <line x1="238" y1="58" x2="238" y2="218"/><line x1="292" y1="58" x2="292" y2="218"/>
    </g>
    <rect x="130" y="69" width="86" height="14" rx="7" fill="url(#bar)" class="grow"/>
    <rect x="172" y="101" width="80" height="14" rx="7" fill="url(#bar)" class="grow b2"/>
    <rect x="208" y="133" width="106" height="14" rx="7" fill="url(#bar)" class="grow b3"/>
    <rect x="264" y="165" width="64" height="14" rx="7" fill="url(#bar)" opacity=".75" class="grow b4"/>
    <rect x="302" y="197" width="30" height="14" rx="7" fill="url(#bar)" opacity=".55" class="grow b5"/>
    <path d="M338 204 l7 -7 l7 7 l-7 7z" fill="#FFB703"/>
    <g class="today">
      <line x1="152" y1="52" x2="152" y2="220" stroke="#5EE1F2" stroke-width="1.5" stroke-dasharray="3 4"/>
      <circle cx="152" cy="52" r="4" fill="#5EE1F2"/>
    </g>
  </g></g>

  <!-- delivery pipeline -->
  <line x1="96" y1="352" x2="1104" y2="352" stroke="#8ECAE6" stroke-opacity=".22" stroke-width="2"/>
  <g clip-path="url(#trackclip)"><rect x="96" y="350.5" width="140" height="3" rx="1.5" fill="url(#pulse)" class="travel"/></g>
  <g class="sans">
    <g class="stage s0"><circle cx="96" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="96" cy="352" r="2.6" fill="#5EE1F2"/><text x="96" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">DISCOVERY</text></g>
    <g class="stage s1"><circle cx="264" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="264" cy="352" r="2.6" fill="#5EE1F2"/><text x="264" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">REQUIREMENTS</text></g>
    <g class="stage s2"><circle cx="432" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="432" cy="352" r="2.6" fill="#5EE1F2"/><text x="432" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">PLANNING</text></g>
    <g class="stage s3"><circle cx="600" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="600" cy="352" r="2.6" fill="#5EE1F2"/><text x="600" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">EXECUTION</text></g>
    <g class="stage s4"><circle cx="768" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="768" cy="352" r="2.6" fill="#5EE1F2"/><text x="768" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">QA</text></g>
    <g class="stage s5"><circle cx="936" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="936" cy="352" r="2.6" fill="#5EE1F2"/><text x="936" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">DELIVERY</text></g>
    <g class="stage s6"><circle cx="1104" cy="352" r="7" fill="#021626" stroke="#5EE1F2" stroke-width="2"/><circle cx="1104" cy="352" r="2.6" fill="#5EE1F2"/><text x="1104" y="382" text-anchor="middle" class="mono" font-size="11" letter-spacing="1.6" fill="#8ECAE6">IMPROVEMENT</text></g>
  </g>
</svg>
