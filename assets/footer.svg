<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Plan with clarity. Coordinate with care. Deliver with confidence.">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#021626"/><stop offset=".5" stop-color="#023047"/><stop offset="1" stop-color="#021626"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .scan{animation:scan 6s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
    @media (prefers-reduced-motion:reduce){.scan{animation:none}}
  </style>
  <rect width="1200" height="130" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="129" rx="22" fill="none" stroke="#8ECAE6" stroke-opacity=".14"/>
  <text x="600" y="62" text-anchor="middle" class="sans" font-size="26" font-weight="600" fill="#EAF6FB">Plan with clarity · Coordinate with care · Deliver with confidence</text>
  <rect x="440" y="82" width="320" height="2" fill="url(#line)" class="scan"/>
  <text x="600" y="110" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#8ECAE6" opacity=".7">KUSAL SANDIPA · SOFTWARE PROJECT MANAGEMENT</text>
</svg>
